<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오직 당신만을 위한 mbti 고민상담</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --bg-color: #f5f6fa;
            --text-color: #2d3436;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            max-width: 500px;
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 30px 24px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .tagline {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* ── [중요] 단계별 화면 제어 클래스 ── */
        .step-panel {
            display: none; /* 기본적으로 모든 화면을 숨김 */
        }

        /* active 클래스가 붙은 화면만 브라우저에 표시됩니다. */
        .step-panel.active {
            display: block !important; 
            animation: fadeInMove 0.4s ease-out forwards;
        }

        @keyframes fadeInMove {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 1단계 입력창 영역 */
        .input-group {
            margin: 30px 0;
            background: #f8f9fa;
            padding: 25px 15px;
            border-radius: 16px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 16px;
            color: #4a4a4a;
        }

        .mbti-input-wrapper {
            max-width: 180px;
            margin: 0 auto 20px auto;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 24px;
            box-sizing: border-box;
            text-transform: uppercase;
            text-align: center;
            font-weight: 800;
            letter-spacing: 5px;
            outline: none;
            transition: all 0.25s ease;
            background-color: #ffffff;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(108, 92, 231, 0.2);
        }

        /* 공통 버튼 디자인 */
        .action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.15);
        }

        .action-btn:hover {
            background-color: #5b4cc4;
            transform: translateY(-1px);
        }

        /* 2단계 결과 상자 */
        .analysis-card {
            background: #faf9ff;
            border: 1.5px solid #e8e5ff;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .analysis-item {
            margin-bottom: 12px;
            font-size: 14.5px;
            line-height: 1.6;
        }
        .analysis-item b {
            color: var(--primary-color);
        }

        /* 3단계 고민 카테고리 그리드 */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .category-btn {
            background-color: #ffffff;
            border: 1.5px solid #edf2f7;
            padding: 14px 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #4a5568;
        }

        .category-btn:hover {
            border-color: var(--secondary-color);
            background-color: #faf9ff;
            color: var(--primary-color);
        }

        .category-btn.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
        }

        /* 최종 조언 출력 박스 */
        .result-box {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
            display: none;
            text-align: left;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            background: #faf9ff;
            padding: 12px;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
        }

        .result-emoji { font-size: 24px; }
        .result-title { font-size: 16px; font-weight: 800; }

        .advice-list { display: flex; flex-direction: column; gap: 10px; }
        .advice-card {
            background: #ffffff;
            border: 1.5px solid #f0f0f0;
            padding: 14px;
            border-radius: 12px;
        }

        .indicator-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .badge-ei { background: #ffeaa7; color: #d63031; }
        .badge-sn { background: #81ecec; color: #00b894; }
        .badge-tf { background: #74b9ff; color: #0984e3; }
        .badge-jp { background: #a29bfe; color: #6c5ce7; }

        .advice-text { font-size: 14px; line-height: 1.5; color: #2d3436; margin: 0; word-break: keep-all; }
        
        .back-link {
            background: none;
            border: none;
            color: #95a5a6;
            cursor: pointer;
            font-weight: 700;
            margin-top: 15px;
            text-decoration: underline;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>오직 당신만을 위한 mbti 고민상담</h1>
    <div class="tagline">"당신의 mbti에 딱 맞는 조언, 들어보시겠어요?"</div>

    <div id="panelStep1" class="step-panel active">
        <div class="input-group">
            <label for="mbtiInput">나의 MBTI 4자리를 입력해 주세요</label>
            <div class="mbti-input-wrapper">
                <input type="text" id="mbtiInput" placeholder="INFP" maxlength="4" autocomplete="off">
            </div>
            <button class="action-btn" onclick="goToStep2()">나의 성격 분석하기 🔮</button>
        </div>
    </div>

    <div id="panelStep2" class="step-panel">
        <h3 id="analysisHeader" style="margin: 0 0 10px 0; font-size: 18px; color: var(--primary-color);"></h3>
        <div class="analysis-card" id="analysisContent">
            </div>
        <button class="action-btn" onclick="goToStep3()">맞춤형 조언 선택하러 가기 ➔</button>
        <button class="back-link" onclick="backToStep1()">◀ MBTI 다시 입력하기</button>
    </div>

    <div id="panelStep3" class="step-panel">
        <div style="text-align: left; font-size: 14px; font-weight: 700; color: #4a4a4a; margin-bottom: 10px; border-left: 3px solid var(--primary-color); padding-left: 6px;">
            해결하고 싶은 고민 카테고리를 선택해 주세요
        </div>
        <div class="category-grid">
            <button class="category-btn" onclick="showFinalAdvice('연애', this)">❤️ 연애</button>
            <button class="category-btn" onclick="showFinalAdvice('공부', this)">✍️ 공부</button>
            <button class="category-btn" onclick="showFinalAdvice('가족', this)">🏡 가족</button>
            <button class="category-btn" onclick="showFinalAdvice('나 자신', this)">👤 나 자신</button>
            <button class="category-btn" onclick="showFinalAdvice('옷 스타일', this)">👗 옷 스타일</button>
            <button class="category-btn" onclick="showFinalAdvice('어울리는 색깔', this)">🎨 어울리는 색깔</button>
            <button class="category-btn" onclick="showFinalAdvice('나만의 분위기', this)">✨ 나만의 분위기</button>
            <button class="category-btn" onclick="showFinalAdvice('취미 추천', this)">🏄‍♂️ 취미 추천</button>
            <button class="category-btn" onclick="showFinalAdvice('친구 궁합', this)">🤝 친구 궁합</button>
            <button class="category-btn" onclick="showFinalAdvice('삶이 힘들 때', this)">🔋 삶이 힘들 때</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-header">
                <div class="result-emoji" id="resultEmoji">🔮</div>
                <div class="result-title" id="resultTitle">맞춤 종합 조언</div>
            </div>
            <div class="advice-list" id="adviceList">
                </div>
        </div>
        
        <button class="back-link" onclick="backToStep2()">◀ 이전 성격 분석으로</button>
    </div>
</div>

<script>

    // 화면 전환 제어 핵심 함수
    function switchView(activePanelId) {
        // 모든 패널을 숨김
        document.querySelectorAll('.step-panel').forEach(panel => {
            panel.classList.remove('active');
        });
        // 대상 패널만 활성화
        document.getElementById(activePanelId).classList.add('active');
    }

    // [1단계 -> 2단계 이동 함수]
    function goToStep2() {
        const inputField = document.getElementById('mbtiInput');
        const mbtiValue = inputField.value.trim().toUpperCase();
        const validatePattern = /^[EI][SN][TF][JP]$/;

        if (!mbtiValue) {
            alert("나의 MBTI를 입력해 주세요!");
            return;
        }
        if (!validatePattern.test(mbtiValue)) {
            alert("올바른 MBTI 4자리를 입력해 주세요! (예: INFP, ESTJ)");
            return;
        }

        // 입력받은 데이터를 전역 변수에 안전하게 바인딩
        userMBTI = mbtiValue;

        // 2단계 특징 텍스트 생성 및 삽입
        document.getElementById('analysisHeader').innerText = `🔮 [${userMBTI}] 유형 종합 성격 분석`;
        
        const chars = userMBTI.split('');
        let htmlSnippet = "";
        chars.forEach(c => {
            if (traitDatabase[c]) {
                htmlSnippet += `<div class="analysis-item">${traitDatabase[c]}</div>`;
            }
        });
        document.getElementById('analysisContent').innerHTML = htmlSnippet;

        // 2단계 화면으로 전환
        switchView('panelStep2');
    }

    // [2단계 -> 3단계 이동 함수]
    function goToStep3() {
        // 기존 선택 이력 및 결과창 숨김 초기화
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('resultBox').style.display = 'none';
        
        // 3단계 화면으로 전환
        switchView('panelStep3');
    }

    // 뒤로 가기 링크 매핑 함수들
    function backToStep1() { switchView('panelStep1'); }
    function backToStep2() { switchView('panelStep2'); }

    // [3단계: 카테고리 클릭 시 실시간 종합 조언 로드 함수]
    function showFinalAdvice(category, element) {
        // 버튼 선택 시각 효과 부여
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');

        const chars = userMBTI.split('');
        const listContainer = document.getElementById('adviceList');
        listContainer.innerHTML = ''; // 중복 축적 방지 초기화

        const activeSubMatrix = adviceDatabase[category];
        const badgeClasses = ['ei', 'sn', 'tf', 'jp'];
        const labelTitles = ['E/I 성향', 'S/N 성향', 'T/F 성향', 'J/P 성향'];

        // 4개의 지표 자리를 분해하여 맞춤 조언 카드 동적 바인딩
        for (let i = 0; i < 4; i++) {
            const char = chars[i];
            const textContent = activeSubMatrix[char];

            const adviceCard = document.createElement('div');
            adviceCard.className = 'advice-card';
            adviceCard.innerHTML = `
                <span class="indicator-badge badge-${badgeClasses[i]}">${labelTitles[i]} (${char})</span>
                <p class="advice-text">${textContent}</p>
            `;
            listContainer.appendChild(adviceCard);
        }

        // 헤더 아이콘 및 제목 업데이트
        document.getElementById('resultEmoji').innerText = emojiMap[category] || "🔮";
        document.getElementById('resultTitle').innerText = `${userMBTI} 유형 맞춤형 [${category}] 종합 분석 처방전`;

        // 결과 영역 열기
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';

        // 모바일 최적화를 위해 결과창으로 자동 포커스 이동
        resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
